version: '3.8'

services:
  # Database Tier [PaaS MySQL Simulation]
  database:
    image: mysql:8.0
    container_name: ecommerce-db-paas
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Application Tier [IaaS VM Server Simulation]
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend-iaas
    restart: always
    environment:
      PORT: 5000
      DB_HOST: database
      DB_USER: ecommerce_user
      DB_PASSWORD: ecommerce_pass
      DB_NAME: ecommerce_db
      JWT_SECRET: supersecret_jwt_key_for_cloud_mapping_project_2026
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy

  # Presentation Tier [PaaS Frontend Simulation]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend-paas
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
